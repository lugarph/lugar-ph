services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lugar
      POSTGRES_USER: lugar
      POSTGRES_PASSWORD: lugar_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lugar -d lugar"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://lugar:lugar_dev@db:5432/lugar
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
